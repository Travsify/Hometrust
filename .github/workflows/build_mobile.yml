name: Build Mobile Apps (Android APK & iOS IPA)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.x'
          channel: 'stable'
      - name: Install dependencies
        run: |
          cd mobile_app
          flutter pub get
      - name: Build APK
        run: |
          cd mobile_app
          flutter build apk --release
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: EstateVerify-Android-APK
          path: mobile_app/build/app/outputs/flutter-apk/app-release.apk

  build-ios:
    name: Build iOS App (No Codesign)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.x'
          channel: 'stable'
      - name: Install dependencies
        run: |
          cd mobile_app
          flutter pub get
      - name: Build iOS
        run: |
          cd mobile_app
          flutter build ios --release --no-codesign
      - name: Package Payload / IPA
        run: |
          mkdir -p Payload
          cp -r mobile_app/build/ios/iphoneos/Runner.app Payload/
          zip -r EstateVerify-iOS.ipa Payload
      - name: Upload iOS App
        uses: actions/upload-artifact@v4
        with:
          name: EstateVerify-iOS-IPA
          path: EstateVerify-iOS.ipa
