name: mobile_app
description: "Hometrust - Nigerian Real Estate Verification, Off-Plan & Pay-Small-Small Platform"
publish_to: 'none'
version: 1.2.1+11

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.3.0
  intl: ^0.20.2
  provider: ^6.1.2
  shared_preferences: ^2.3.5
  file_picker: ^8.1.6
  url_launcher: ^6.3.1
  local_auth: ^2.3.0
  socket_io_client: ^3.0.2
  share_plus: ^10.1.4
  path_provider: ^2.1.5
  video_player: ^2.9.2
  onesignal_flutter: ^5.6.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3
  flutter_native_splash: ^2.4.4

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#0F172A"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"

flutter_native_splash:
  color: "#0F172A"
  image: "assets/icon/app_icon.png"
  android: true
  ios: true

flutter:
  uses-material-design: true
  assets:
    - assets/icon/
